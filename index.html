<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="KeyGo - 激活码分发管理系统">
  <title>KeyGo</title>

  <!-- 主题初始化：渲染前根据 localStorage / 系统偏好设置 data-theme，避免暗色闪白 -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('keygo-theme-mode') || 'auto';
        var dark = mode === 'dark' ||
          (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { /* ignore */ }
    })();
  </script>

  <!-- antd reset.css 已改为本地依赖引入（main.tsx），避免 CDN 被浏览器跟踪防护拦截 -->

  <!-- ===== CDN: Importmap（React + antd + icons + react-19 patch）via esm.sh ===== -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.2.8",
      "react/jsx-runtime": "https://esm.sh/react@19.2.8/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@19.2.8?external=react",
      "react-dom/client": "https://esm.sh/react-dom@19.2.8/client?external=react",
      "antd": "https://esm.sh/antd@5.29.3?external=react,react-dom,@ant-design/icons",
      "@ant-design/icons": "https://esm.sh/@ant-design/icons@5.6.1?external=react,react-dom",
      "@ant-design/v5-patch-for-react-19": "https://esm.sh/@ant-design/v5-patch-for-react-19@1.0.3?external=react,react-dom,antd"
    }
  }
  </script>

  <!-- 首屏加载动画，提升感知性能 -->
  <style>
    #root:empty {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #root:empty::after {
      content: '';
      width: 32px;
      height: 32px;
      border: 3px solid #e2e8f0;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: app-spin 0.7s linear infinite;
    }

    @keyframes app-spin {
      to {
        transform: rotate(360deg);
      }
    }

    html[data-theme='dark'] #root:empty::after {
      border-color: #334155;
      border-top-color: #6366f1;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
