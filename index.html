<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="KeyGo - 激活码分发管理系统">
  <title>KeyGo</title>

  <!-- 主题初始化：渲染前根据 localStorage / 系统偏好设置 data-theme，避免暗色闪白 -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('keygo-theme-mode') || 'auto';
        var dark = mode === 'dark' ||
          (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { /* ignore */ }
    })();
  </script>

  <!-- antd reset.css 已改为本地依赖引入（main.tsx），避免 CDN 被浏览器跟踪防护拦截 -->
  <!-- React / antd / icons 全部本地打包（vite.config.ts），不依赖任何外部 CDN，保证生产环境可离线部署 -->

  <!-- 首屏加载动画，提升感知性能 -->
  <style>
    #root:empty {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #root:empty::after {
      content: '';
      width: 32px;
      height: 32px;
      border: 3px solid #e2e8f0;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: app-spin 0.7s linear infinite;
    }

    @keyframes app-spin {
      to {
        transform: rotate(360deg);
      }
    }

    html[data-theme='dark'] #root:empty::after {
      border-color: #334155;
      border-top-color: #6366f1;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
