<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- 圆角背景 -->
  <rect x="8" y="8" width="240" height="240" rx="56" ry="56" fill="url(#bg)"/>
  <!-- 高光 -->
  <rect x="8" y="8" width="240" height="120" rx="56" ry="56" fill="white" opacity="0.08"/>
  <!-- 钥匙图标 -->
  <g transform="translate(128, 128)" filter="url(#shadow)">
    <!-- 钥匙环 -->
    <circle cx="-28" cy="0" r="34" fill="none" stroke="white" stroke-width="18" stroke-linecap="round"/>
    <!-- 钥匙杆 -->
    <line x1="-4" y1="0" x2="56" y2="0" stroke="white" stroke-width="18" stroke-linecap="round"/>
    <!-- 钥匙齿 -->
    <line x1="36" y1="0" x2="36" y2="22" stroke="white" stroke-width="14" stroke-linecap="round"/>
    <line x1="54" y1="0" x2="54" y2="16" stroke="white" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
